# cargo-audit configuration.
#
# Advisory IDs listed under `ignore` are downgraded to soft warnings
# so `cargo audit --deny warnings` still passes. Every entry MUST
# carry a rationale and a review date; unreviewed entries are a
# code smell.
#
# NOTE: any exception here MUST be mirrored in `deny.toml`'s
# `[advisories].ignore` — cargo-audit and cargo-deny do NOT share
# this file. See STANDARDS.md §5.

[advisories]
ignore = [
    # RUSTSEC-2024-0449 — unsafe-libyaml is unmaintained.
    # Pulled transitively via serde_yaml_ng 0.10 (latest), which every
    # maintained Rust YAML crate currently depends on. No known
    # vulnerability — the advisory is an "unmaintained" marker.
    # XTR only parses operator-controlled YAML (xtr.yaml + .soap.yaml
    # sidecars) at boot, never untrusted input. Mirrored in deny.toml.
    # Review: 2027-04-14.
    "RUSTSEC-2024-0449",
]
